version: "3.9"

services:

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    depends_on:
      - neo4j
    networks:
      - foodnet
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    networks:
      - foodnet

  neo4j:
    image: neo4j:5.22
    container_name: neo4j
    ports:
      - "7474:7474"   # Neo4J Browser UI
      - "7687:7687"   # Bolt protocol (backend → neo4j)
    environment:
      NEO4J_AUTH: neo4j/password123
    networks:
      - foodnet
    volumes:
      - neo4j_data:/data

networks:
  foodnet:
    driver: bridge

volumes:
  neo4j_data:
